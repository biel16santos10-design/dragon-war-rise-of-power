<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Dragon War: Rise of Power</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#18203a,#05070b 65%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(1100px,96%);margin:auto;padding:14px 0 40px}
header{background:linear-gradient(135deg,#17152b,#30205e);border:1px solid #714bd6;border-radius:20px;padding:18px;text-align:center;box-shadow:0 12px 35px #0008}
header h1{margin:0;font-size:clamp(25px,5vw,44px)}
.sub{opacity:.82;margin-top:7px}
.status{margin-top:12px;padding:10px;border-radius:12px;background:#0005;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.btn{border:0;border-radius:15px;padding:15px 12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2563eb,#06b6d4);box-shadow:0 7px 16px #0005}
.btn:hover{filter:brightness(1.08)}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706)}
.btn.green{background:linear-gradient(135deg,#16a34a,#15803d)}
.btn.purple{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.btn.dark{background:#263246}
.panel{margin-top:14px;background:#102039dd;border:1px solid #416083;border-radius:20px;padding:18px;box-shadow:0 10px 28px #0005}
.panel h2{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:#0004;border:1px solid #ffffff18;border-radius:14px;padding:12px}
.stat b{display:block;font-size:19px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:#0b1324;border:1px solid #ffffff1a;border-radius:16px;padding:14px}
.card h3{margin:0 0 7px}
.card p{opacity:.84;min-height:38px}
.small{font-size:13px;opacity:.76}
.log{background:#050914;border-radius:14px;padding:12px;min-height:85px;white-space:pre-line}
input,select{width:100%;background:#07101e;color:#fff;border:1px solid #4b6380;border-radius:11px;padding:11px;margin:5px 0}
.table{overflow:auto}.row{display:grid;grid-template-columns:45px 1.6fr .8fr .8fr 1.2fr;gap:8px;align-items:center;background:#081221;border:1px solid #ffffff12;border-radius:12px;padding:10px;margin:7px 0}.adminrow{grid-template-columns:1fr 1fr 1fr 1fr}
.name-admin{color:#ffd43b;font-weight:900;text-shadow:0 0 9px #ffb300}
.name-normal{color:#fff;font-weight:800}
.medal{font-size:22px}.danger{color:#ff8c8c}.ok{color:#70f0a0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#101a2c;border:1px solid #6078a0;border-radius:20px;padding:20px}
.toast{position:fixed;right:15px;bottom:15px;background:#101827;border:1px solid #5d77a2;padding:13px 16px;border-radius:13px;z-index:30;box-shadow:0 8px 25px #0008}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:38px 1fr .7fr}.row>*:nth-child(n+4){display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🔥 Dragon War: Rise of Power 🔥</h1>
  <div class="sub">🎮 Desenvolvido por Gabriel Cabral</div>
  <div id="status" class="status">⏳ Conectando ao Firebase...</div>
</header>

<section id="start" class="panel">
  <h2>⚔️ Bem-vindo!</h2>
  <p>Escolha seu nome, carregue seu progresso ou comece um novo jogo.</p>
  <input id="nomeInput" maxlength="24" placeholder="Seu nome">
  <div class="grid">
    <button class="btn green" onclick="novoJogo()">🆕 Novo Jogo</button>
    <button class="btn" onclick="carregar()">📂 Carregar</button>
    <button class="btn purple" onclick="abrirNome()">👤 Meu Nome</button>
  </div>
  <div id="startInfo" class="small" style="margin-top:12px"></div>
</section>

<section id="game" class="hidden">
  <div class="grid">
    <button class="btn" onclick="mostrar('aventura')">📖 Aventura</button>
    <button class="btn gold" onclick="mostrar('loja')">🛒 Loja</button>
    <button class="btn red" onclick="mostrar('combate')">⚔️ Combate</button>
    <button class="btn dark" onclick="carregar()">📂 Carregar</button>
    <button class="btn red" onclick="novoJogo()">🔄 Novo Jogo</button>
    <button class="btn purple" onclick="abrirNome()">👤 Meu Nome</button>
    <button class="btn" onclick="mostrar('ranking');carregarRanking()">🏆 Ranking</button>
    <button id="adminBtn" class="btn gold hidden" onclick="mostrar('admin');carregarAdmin()">🛡️ Painel ADM</button>
  </div>

  <div id="stats" class="panel"></div>
  <div id="aventura" class="panel"></div>
  <div id="loja" class="panel hidden"></div>
  <div id="combate" class="panel hidden"></div>
  <div id="ranking" class="panel hidden"></div>
  <div id="admin" class="panel hidden"></div>
</section>
</div>
<div id="modal" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,set,get,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyDA_kn3eNRD9P2D6WDCNbUxBKld0i9Sys",
  authDomain:"dragon-war-rise-of-power.firebaseapp.com",
  databaseURL:"https://dragon-war-rise-of-power-default-rtdb.firebaseio.com",
  projectId:"dragon-war-rise-of-power",
  storageBucket:"dragon-war-rise-of-power.firebasestorage.app",
  messagingSenderId:"1002858781019",
  appId:"1:1002858781019:web:6cd6d1b0173ab37c7fe27e",
  measurementId:"G-PY4TRBXZ8N"
};
const ADMIN_UID="w2aAcmul8vYJOR05lGLQThAsiTg2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
let usuarioFirebase=null;
let pronto=false;
let jogador=null;
let inimigoAtual=null;
let unsubscribeRanking=null;

const $=id=>document.getElementById(id);
const escapar=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const admin=()=>usuarioFirebase?.uid===ADMIN_UID;
const nomeHTML=(uid,nome)=>uid===ADMIN_UID?`<span class="name-admin">${escapar(nome||"ADM")}</span>`:`<span class="name-normal">${escapar(nome||"Jogador")}</span>`;
const aviso=(t)=>{ $("toast").textContent=t; $("toast").classList.remove("hidden"); setTimeout(()=>$("toast").classList.add("hidden"),2500); };

const inimigos=[
 {id:"goblin",nome:"Goblin",vida:100,ataque:8,pontos:50,moedas:80},
 {id:"demonio",nome:"Demônio",vida:250,ataque:18,pontos:120,moedas:200},
 {id:"dragao",nome:"Dragão Sombrio",vida:500,ataque:30,pontos:300,moedas:500}
];

const personagens=[
 {id:"Guerreiro",preco:0,vida:140,mana:70,poder:12,desc:"Equilibrado e resistente."},
 {id:"Mago",preco:500,vida:90,mana:150,poder:18,desc:"Mais mana e magia."},
 {id:"Ninja",preco:800,vida:110,mana:100,poder:20,desc:"Ataques rápidos e fortes."}
];

const poderes=[
 {id:"Cura",preco:250,desc:"Recupera 40 de vida."},
 {id:"Bola de Fogo",preco:400,desc:"Causa dano extra no combate."},
 {id:"Raio Sombrio",preco:700,desc:"Causa um grande dano extra."}
];

const armas=[
 {id:"Espada de Ferro",preco:0,dano:10},
 {id:"Espada Flamejante",preco:600,dano:22},
 {id:"Lâmina do Dragão",preco:1200,dano:40}
];

function jogadorPadrao(nome="Jogador"){
 return {nome,pontos:0,moedas:300,nivel:1,vida:100,mana:80,personagem:"Guerreiro",arma:"Espada de Ferro",poderes:[]};
}

function mostrar(id){
 ["aventura","loja","combate","ranking","admin"].forEach(x=>$(x).classList.add("hidden"));
 $(id).classList.remove("hidden");
 if(id==="aventura") renderAventura();
 if(id==="loja") renderLoja();
 if(id==="combate") renderCombate();
 if(id==="ranking") carregarRanking();
 if(id==="admin") carregarAdmin();
}

function renderStats(){
 if(!jogador)return;
 const pers=personagens.find(x=>x.id===jogador.personagem)||personagens[0];
 const arma=armas.find(x=>x.id===jogador.arma)||armas[0];
 $("stats").innerHTML=`
 <h2>📊 ${nomeHTML(usuarioFirebase?.uid,jogador.nome)}</h2>
 <div class="stats">
  <div class="stat">❤️ Vida<b>${jogador.vida}</b></div>
  <div class="stat">🔵 Mana<b>${jogador.mana}</b></div>
  <div class="stat">⭐ Pontos<b>${jogador.pontos}</b></div>
  <div class="stat">🪙 Moedas<b>${jogador.moedas}</b></div>
  <div class="stat">⚔️ Arma<b>${escapar(jogador.arma)}</b></div>
  <div class="stat">🧙 Personagem<b>${escapar(jogador.personagem)}</b></div>
  <div class="stat">📈 Nível<b>${jogador.nivel}</b></div>
  <div class="stat">💥 Poder<b>${pers.poder+arma.dano}</b></div>
 </div>`;
}

function renderAventura(){
 $("aventura").innerHTML=`
 <h2>📖 Aventura</h2>
 <p>Explore o mundo, lute contra inimigos e conquiste pontos para subir no ranking.</p>
 <div class="cards">
  ${inimigos.map(e=>`<div class="card"><h3>👹 ${e.nome}</h3><p>❤️ ${e.vida} HP • ⚔️ ${e.ataque} ataque<br>🏆 ${e.pontos} pontos • 🪙 ${e.moedas} moedas</p><button class="btn red" onclick="selecionarInimigo('${e.id}')">Lutar</button></div>`).join("")}
 </div>`;
}

function renderLoja(){
 $("loja").innerHTML=`
 <h2>🛒 Loja</h2>
 <p>Compre personagens, poderes e armas com suas moedas.</p>
 <h3>🧙 Personagens</h3>
 <div class="cards">${personagens.map(p=>`<div class="card"><h3>${p.id}</h3><p>${p.desc}<br>❤️ ${p.vida} • 🔵 ${p.mana} • 💥 ${p.poder}</p><b>🪙 ${p.preco}</b><br><button class="btn green" style="margin-top:8px" onclick="comprarPersonagem('${p.id}')">${jogador.personagem===p.id?"Equipado":"Comprar"}</button></div>`).join("")}</div>
 <h3>✨ Poderes</h3>
 <div class="cards">${poderes.map(p=>`<div class="card"><h3>${p.id}</h3><p>${p.desc}</p><b>🪙 ${p.preco}</b><br><button class="btn purple" style="margin-top:8px" onclick="comprarPoder('${p.id}')">Comprar</button></div>`).join("")}</div>
 <h3>⚔️ Armas</h3>
 <div class="cards">${armas.map(a=>`<div class="card"><h3>${a.id}</h3><p>Dano +${a.dano}</p><b>🪙 ${a.preco}</b><br><button class="btn gold" style="margin-top:8px" onclick="comprarArma('${a.id}')">${jogador.arma===a.id?"Equipado":"Comprar"}</button></div>`).join("")}</div>`;
}

function renderCombate(){
 if(!inimigoAtual){
  $("combate").innerHTML=`<h2>⚔️ Combate</h2><p>Escolha um inimigo na Aventura.</p>`;
  return;
 }
 $("combate").innerHTML=`
 <h2>⚔️ Contra ${inimigoAtual.nome}</h2>
 <div class="card">
  <p>❤️ Inimigo: <b>${inimigoAtual.vidaAtual}/${inimigoAtual.vida}</b></p>
  <p>❤️ Sua vida: <b>${jogador.vida}</b> • 🔵 Mana: <b>${jogador.mana}</b></p>
  <button class="btn red" onclick="atacar()">⚔️ Atacar</button>
  <button class="btn purple" onclick="usarPoder()">✨ Usar Poder</button>
  <button class="btn dark" onclick="fugir()">🏃 Fugir</button>
  <div class="log" id="logCombate" style="margin-top:12px">${escapar(inimigoAtual.log||"O combate começou!")}</div>
 </div>`;
}

window.selecionarInimigo=(id)=>{
 const base=inimigos.find(x=>x.id===id);
 inimigoAtual={...base,vidaAtual:base.vida,log:`Você encontrou ${base.nome}! Prepare-se!`};
 mostrar("combate");
};

function finalizarVitoria(){
 jogador.pontos+=inimigoAtual.pontos;
 jogador.moedas+=inimigoAtual.moedas;
 jogador.nivel=Math.max(1,Math.floor(jogador.pontos/300)+1);
 jogador.vida=Math.min(160,jogador.vida+20);
 jogador.mana=Math.min(160,jogador.mana+20);
 aviso(`🏆 Vitória! +${inimigoAtual.pontos} pontos e +${inimigoAtual.moedas} moedas.`);
 salvar();
 inimigoAtual=null;
 renderStats();
 renderAventura();
 mostrar("aventura");
}

window.atacar=()=>{
 if(!inimigoAtual)return;
 const pers=personagens.find(x=>x.id===jogador.personagem)||personagens[0];
 const arma=armas.find(x=>x.id===jogador.arma)||armas[0];
 const dano=pers.poder+arma.dano+Math.floor(Math.random()*8);
 inimigoAtual.vidaAtual-=dano;
 if(inimigoAtual.vidaAtual<=0){finalizarVitoria();return;}
 jogador.vida-=inimigoAtual.ataque;
 inimigoAtual.log=`⚔️ Você causou ${dano} de dano. ${inimigoAtual.nome} respondeu com ${inimigoAtual.ataque} de dano.`;
 if(jogador.vida<=0){
  jogador.vida=1;
  inimigoAtual.log+="\n💀 Você quase foi derrotado e escapou por pouco!";
  aviso("💀 Você ficou com 1 de vida.");
 }
 renderStats();renderCombate();
};

window.usarPoder=()=>{
 if(!inimigoAtual)return;
 if(!jogador.poderes.length){aviso("Você ainda não possui poderes.");return;}
 if(jogador.mana<20){aviso("Mana insuficiente.");return;}
 const poder=jogador.poderes[jogador.poderes.length-1];
 const dano=poder==="Raio Sombrio"?90:poder==="Bola de Fogo"?55:0;
 jogador.mana-=20;
 if(poder==="Cura"){
  jogador.vida=Math.min(160,jogador.vida+40);
  inimigoAtual.log="✨ Você usou Cura e recuperou 40 de vida.";
 }else{
  inimigoAtual.vidaAtual-=dano;
  inimigoAtual.log=`✨ ${poder} causou ${dano} de dano!`;
  if(inimigoAtual.vidaAtual<=0){finalizarVitoria();return;}
  jogador.vida-=inimigoAtual.ataque;
 }
 renderStats();renderCombate();
};

window.fugir=()=>{inimigoAtual=null;mostrar("aventura");};

async function salvar(){
 if(!usuarioFirebase||!jogador)return;
 const uid=usuarioFirebase.uid;
 const dados={...jogador,atualizadoEm:Date.now()};
 const updates={};
 updates[`jogadores/${uid}`]=dados;
 updates[`ranking/${uid}`]={uid,nome:jogador.nome,pontos:jogador.pontos,nivel:jogador.nivel,personagem:jogador.personagem,atualizadoEm:Date.now()};
 try{
  await update(ref(db),updates);
  aviso("💾 Progresso salvo!");
 }catch(e){
  console.error(e);aviso("❌ Não foi possível salvar.");
 }
}

async function carregarJogador(){
 if(!usuarioFirebase)return;
 try{
  const snap=await get(ref(db,`jogadores/${usuarioFirebase.uid}`));
  if(snap.exists()) jogador={...jogadorPadrao(),...snap.val()};
  else jogador=jogadorPadrao();
  $("nomeInput").value=jogador.nome||"";
  renderStats();
  pronto=true;
  $("status").innerHTML=admin()?"🛡️ Conectado como ADM":"🟢 Conectado ao servidor";
  $("adminBtn").classList.toggle("hidden",!admin());
  $("game").classList.remove("hidden");
  renderAventura();
 }catch(e){
  console.error(e);
  $("status").textContent="❌ Erro ao carregar jogador";
 }
}

window.novoJogo=async()=>{
 if(!usuarioFirebase){aviso("⏳ Aguarde a conexão.");return;}
 const nome=($("nomeInput").value||"").trim()||"Jogador";
 jogador=jogadorPadrao(nome);
 inimigoAtual=null;
 await salvar();
 renderStats();renderAventura();mostrar("aventura");
 aviso("🆕 Novo jogo criado!");
};

window.carregar=async()=>{
 await carregarJogador();
 if(pronto)mostrar("aventura");
};

window.abrirNome=()=>{
 $("modal").className="modal";
 $("modal").innerHTML=`<div class="modalbox"><h2>👤 Alterar nome</h2><input id="novoNome" maxlength="24" value="${escapar(jogador?.nome||"Jogador")}"><button class="btn green" onclick="salvarNome()">Salvar nome</button> <button class="btn dark" onclick="fecharModal()">Cancelar</button></div>`;
};

window.salvarNome=async()=>{
 const n=($("novoNome").value||"").trim();
 if(!n){aviso("Digite um nome.");return}
 jogador.nome=n;
 $("nomeInput").value=n;
 await salvar();renderStats();fecharModal();mostrar("aventura");
};
window.fecharModal=()=>{$("modal").className="hidden";$("modal").innerHTML=""};

window.comprarPersonagem=async id=>{
 const p=personagens.find(x=>x.id===id);
 if(jogador.personagem===id){aviso("Esse personagem já está equipado.");return}
 if(jogador.moedas<p.preco){aviso("Moedas insuficientes.");return}
 jogador.moedas-=p.preco;jogador.personagem=id;
 jogador.vida=p.vida;jogador.mana=p.mana;
 await salvar();renderStats();renderLoja();
};

window.comprarPoder=async id=>{
 const p=poderes.find(x=>x.id===id);
 if(jogador.poderes.includes(id)){aviso("Você já possui esse poder.");return}
 if(jogador.moedas<p.preco){aviso("Moedas insuficientes.");return}
 jogador.moedas-=p.preco;jogador.poderes.push(id);
 await salvar();renderStats();renderLoja();
};

window.comprarArma=async id=>{
 const a=armas.find(x=>x.id===id);
 if(jogador.arma===id){aviso("Essa arma já está equipada.");return}
 if(jogador.moedas<a.preco){aviso("Moedas insuficientes.");return}
 jogador.moedas-=a.preco;jogador.arma=id;
 await salvar();renderStats();renderLoja();
};

window.carregarRanking=async()=>{
 const box=$("ranking");
 box.innerHTML=`<h2>🏆 Ranking Global</h2><p>Carregando...</p>`;
 try{
  if(!usuarioFirebase){box.innerHTML=`<h2>🏆 Ranking Global</h2><div class="info">⏳ Conectando ao Firebase...</div>`;return}
  const snap=await get(ref(db,"ranking"));
  if(!snap.exists()){box.innerHTML=`<h2>🏆 Ranking Global</h2><p>Nenhum jogador ainda.</p>`;return}
  const arr=[];
  snap.forEach(c=>{const d=c.val()||{};arr.push({uid:c.key,...d,pontos:Number(d.pontos||0),nivel:Number(d.nivel||1)})});
  arr.sort((a,b)=>b.pontos-a.pontos);
  box.innerHTML=`<h2>🏆 Ranking Global</h2><p class="small">Somente o ADM recebe o nome colorido.</p>`+
    arr.map((p,i)=>`<div class="row"><div class="medal">${i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}</div><div>${nomeHTML(p.uid,p.nome)}<div class="small">Nível ${p.nivel} • ${escapar(p.personagem||"Guerreiro")}</div></div><div>⭐ ${p.pontos}</div></div>`).join("");
 }catch(e){
  console.error(e);
  box.innerHTML=`<h2>🏆 Ranking Global</h2><div class="danger">❌ Erro: ${escapar(e.message||e)}</div>`;
 }
};

async function carregarAdmin(){
 if(!admin())return;
 const box=$("admin");
 box.innerHTML=`<h2>🛡️ Painel do ADM</h2><p>Carregando jogadores...</p>`;
 try{
  const [jSnap,rSnap]=await Promise.all([get(ref(db,"jogadores")),get(ref(db,"ranking"))]);
  const mapa={};
  if(jSnap.exists())jSnap.forEach(c=>mapa[c.key]={uid:c.key,...(c.val()||{})});
  if(rSnap.exists())rSnap.forEach(c=>mapa[c.key]={...(mapa[c.key]||{}),uid:c.key,...(c.val()||{})});
  const arr=Object.values(mapa).sort((a,b)=>Number(b.pontos||0)-Number(a.pontos||0));
  box.innerHTML=`<h2>🛡️ Painel do ADM</h2>
  <p class="small">UID do ADM: ${escapar(ADMIN_UID)}</p>
  <input id="buscaAdmin" placeholder="🔎 Buscar por nome ou UID" oninput="filtrarAdmin()">
  <div id="adminLista">${arr.map(adminCard).join("")||"<p>Nenhum jogador.</p>"}</div>`;
 }catch(e){box.innerHTML=`<h2>🛡️ Painel do ADM</h2><div class="danger">❌ ${escapar(e.message||e)}</div>`}
}
function adminCard(p){
 return `<div class="card admin-player" data-search="${escapar((p.nome||"")+" "+(p.uid||"").toLowerCase())}">
 <h3>${nomeHTML(p.uid,p.nome||"Jogador")}</h3>
 <div class="small">UID: ${escapar(p.uid)}</div>
 <div class="grid">
  <input id="n-${p.uid}" value="${escapar(p.nome||"Jogador")}" placeholder="Nome">
  <input id="p-${p.uid}" type="number" value="${Number(p.pontos||0)}" placeholder="Pontos">
  <input id="m-${p.uid}" type="number" value="${Number(p.moedas||0)}" placeholder="Moedas">
  <input id="l-${p.uid}" type="number" value="${Number(p.nivel||1)}" placeholder="Nível">
 </div>
 <div style="margin-top:8px">
  <button class="btn green" onclick="editarPlayer('${p.uid}')">💾 Salvar</button>
  <button class="btn red" onclick="bloquear('${p.uid}')">🚫 Bloquear</button>
  <button class="btn dark" onclick="removerPlayer('${p.uid}')">🗑️ Remover</button>
 </div></div>`;
}
window.filtrarAdmin=()=>{
 const q=($("buscaAdmin").value||"").toLowerCase();
 document.querySelectorAll(".admin-player").forEach(x=>x.style.display=x.dataset.search.includes(q)?"block":"none");
};
window.editarPlayer=async uid=>{
 if(!admin()||uid===ADMIN_UID)return;
 const nome=$(`n-${uid}`).value.trim()||"Jogador";
 const pontos=Number($(`p-${uid}`).value||0);
 const moedas=Number($(`m-${uid}`).value||0);
 const nivel=Number($(`l-${uid}`).value||1);
 try{
  await update(ref(db,`jogadores/${uid}`),{nome,pontos,moedas,nivel,atualizadoEm:Date.now()});
  await update(ref(db,`ranking/${uid}`),{uid,nome,pontos,nivel});
  aviso("✅ Jogador atualizado.");
  carregarAdmin();
 }catch(e){aviso("❌ "+(e.message||"Erro"))}
};
window.bloquear=async uid=>{
 if(!admin()||uid===ADMIN_UID)return;
 try{await set(ref(db,`bloqueados/${uid}`),true);aviso("🚫 Jogador bloqueado.");carregarAdmin()}catch(e){aviso("❌ "+e.message)}
};
window.removerPlayer=async uid=>{
 if(!admin()||uid===ADMIN_UID)return;
 if(!confirm("Remover os dados deste jogador?"))return;
 try{await remove(ref(db,`jogadores/${uid}`));await remove(ref(db,`ranking/${uid}`));await remove(ref(db,`bloqueados/${uid}`));aviso("🗑️ Dados removidos.");carregarAdmin()}catch(e){aviso("❌ "+e.message)}
};

onAuthStateChanged(auth,async user=>{
 if(user){
  usuarioFirebase=user;
  $("status").textContent=admin()?"🛡️ Autenticado como ADM":"🟢 Autenticado";
  await carregarJogador();
 }else{
  usuarioFirebase=null;
  $("status").textContent="⏳ Autenticando...";
 }
});
signInAnonymously(auth).catch(e=>{
 console.error(e);
 $("status").textContent="❌ Erro de autenticação: "+e.message;
});

window.mostrar=mostrar;window.salvar=salvar;window.carregarAdmin=carregarAdmin;window.renderLoja=renderLoja;window.renderCombate=renderCombate;
</script>
</body>
</html>
