<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dragon War — Jogador</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060d;color:#eef7ff;font-family:Arial,sans-serif}
.app{min-height:100vh;background:radial-gradient(circle at 50% 10%,#17375e,#050914 65%);padding-bottom:30px}
header{padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#071322ee;border-bottom:1px solid #28506d;position:sticky;top:0;z-index:5}
.logo{font:700 24px Georgia;color:#ffd47b}.profile{display:flex;gap:10px;align-items:center}.avatar{font-size:32px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 11px;border:1px solid #31516e;border-radius:20px;background:#081729}
main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#0a1728ee;border:1px solid #294b68;border-radius:14px;padding:15px}.hero{text-align:center;padding:45px 15px}.hero h1{font:42px Georgia;color:#ffe0a2;margin:10px}.hero .dragon{font-size:100px}.btn{border:1px solid #38dfff;background:#0b5574;color:white;padding:11px 16px;border-radius:9px;font-weight:800;cursor:pointer}
.btn.gold{border-color:#ffb34e;background:#9b421b}.btn.red{border-color:#ff5e6c;background:#70202d}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #36516b;background:#06101d;color:#fff;margin:6px 0 10px}
h2{color:#ffd47b}.muted{color:#9fb2c8}.rank{display:grid;grid-template-columns:50px 1fr 90px 100px;gap:8px;padding:11px;border-bottom:1px solid #22354a;align-items:center}
.rank.me{background:#12304866;border-left:3px solid #ffd15a}.pos{color:#ffd56a;font-size:20px}.points{color:#79dcff;text-align:right}
@media(max-width:700px){.grid{grid-template-columns:1fr}.rank{grid-template-columns:40px 1fr 75px}.rank .level{display:none}.logo{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="profile"><div class="avatar">⚔️</div><div><b id="name">Jogador</b><div class="muted">Nível <span id="level">1</span></div></div></div>
 <div class="logo">DRAGON WAR</div>
 <div class="stats"><div class="pill">🪙 <b id="coins">1.000</b></div><div class="pill">💎 <b id="gems">20</b></div><div class="pill">🏆 <b id="points">0</b></div></div>
</header>
<main>
<section class="card hero">
 <div class="dragon">🐉</div><h1>DRAGON WAR</h1><p class="muted">RISE OF POWER</p>
 <button class="btn gold" onclick="addPoints()">⚔️ GANHAR PONTOS DE TESTE</button>
</section>

<section class="card">
 <h2>🏆 Ranking Global</h2>
 <p class="muted">Jogadores são ordenados pela pontuação. Administradores ficam em uma seção separada.</p>
 <div id="ranking"></div>
</section>

<section class="card" style="margin-top:14px">
 <h2>👤 Meu perfil</h2>
 <input id="nameInput" maxlength="18" placeholder="Seu nome">
 <button class="btn" onclick="saveProfile()">SALVAR PERFIL</button>
 <p class="muted">Seu nome não pode conter "ADM", "ADMIN" ou "ADMINISTRADOR".</p>
</section>
</main>
</div>

<script>
const KEY="dragonWarPlayersV1";
let me=JSON.parse(localStorage.getItem("dragonWarMe")||"null")||{
 id:"p_"+Math.random().toString(36).slice(2),
 name:"Jogador",
 level:1,points:0,coins:1000,gems:20,lastSeen:Date.now()
};
function players(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function savePlayers(a){localStorage.setItem(KEY,JSON.stringify(a))}
function sync(){
 me.lastSeen=Date.now();
 const a=players().filter(x=>x.id!==me.id);
 a.push(me);savePlayers(a);render();
}
function render(){
 document.getElementById("name").textContent=me.name;
 document.getElementById("level").textContent=me.level;
 document.getElementById("coins").textContent=me.coins.toLocaleString("pt-BR");
 document.getElementById("gems").textContent=me.gems.toLocaleString("pt-BR");
 document.getElementById("points").textContent=me.points.toLocaleString("pt-BR");
 document.getElementById("nameInput").value=me.name;
 const cutoff=Date.now()-120000;
 const list=players().filter(x=>x.lastSeen>cutoff && !x.admin).sort((a,b)=>b.points-a.points);
 document.getElementById("ranking").innerHTML=
   list.length?list.map((p,i)=>`<div class="rank ${p.id===me.id?"me":""}">
   <div class="pos">#${i+1}</div><div><b>${escapeHtml(p.name)}</b></div>
   <div class="level">Nível ${p.level}</div><div class="points">${p.points.toLocaleString("pt-BR")}</div></div>`).join("")
   :'<p class="muted">Nenhum jogador online neste navegador.</p>';
}
function saveProfile(){
 const n=document.getElementById("nameInput").value.trim();
 if(n.length<3)return alert("Use pelo menos 3 caracteres.");
 if(/adm|admin|administrador/i.test(n))return alert("Esse nome não está disponível.");
 me.name=n;sync();
}
function addPoints(){
 me.points+=100;me.level=Math.max(1,Math.floor(me.points/500)+1);me.coins+=250;sync();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
sync();setInterval(sync,30000);window.addEventListener("storage",render);
</script>
</body>
</html>
